workflows:
  android:
    name: Punjabi Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create platform folders
        script: |
          flutter create --platforms=android,ios --project-name punjabi_learn .
          rm -rf test
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
  ios:
    name: Punjabi iOS IPA (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create platform folders
        script: |
          flutter create --platforms=android,ios --project-name punjabi_learn .
          rm -rf test
      - name: Get packages
        script: flutter pub get
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r punjabi_learn.ipa Payload
    artifacts:
      - punjabi_learn.ipa
