workflows:
  android:
    name: Learn Punjabi Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create platform folders and check app code
        script: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done || true
          if [ -f punjabi_learn/lib/main.dart ]; then cp -R punjabi_learn/. .; fi
          mkdir -p assets/audio
          for f in *.m4a *.mp3 *.wav *.aac; do [ -f "$f" ] && mv "$f" assets/audio/; done || true
          for d in recordings Recordings; do [ -d "$d" ] && find "$d" -type f \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.aac' \) -exec cp {} assets/audio/ \; ; done || true
          if [ -f main.dart ] && [ ! -f lib/main.dart ]; then mkdir -p lib && cp main.dart lib/main.dart; fi
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/main.dart.bak; fi
          flutter create --platforms=android,ios --project-name punjabi_learn .
          if [ -f /tmp/main.dart.bak ]; then cp /tmp/main.dart.bak lib/main.dart; fi
          rm -rf test
          if ! grep -q "Learn Punjabi" lib/main.dart; then echo "ERROR: lib/main.dart is missing or is the default counter app. Add the Punjabi app code at lib/main.dart in the repo."; exit 1; fi
      - name: Get packages
        script: |
          flutter pub add flutter_tts shared_preferences audioplayers http
          flutter pub get
      - name: Set app name and icon
        script: |
          perl -pi -e 's/android:label="[^"]*"/android:label="Learn Punjabi"/' android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          if [ -f assets/icon.png ] && [ -f assets/icon_fg.png ]; then
            flutter pub add --dev flutter_launcher_icons
            printf '%s\n' 'flutter_launcher_icons:' '  android: true' '  ios: true' '  image_path: "assets/icon.png"' '  remove_alpha_ios: true' '  adaptive_icon_background: "#C5426C"' '  adaptive_icon_foreground: "assets/icon_fg.png"' > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons
          else
            echo "WARNING: assets/icon.png or assets/icon_fg.png not found, using the default icon."
          fi
      - name: Build APK
        script: flutter build apk --release --dart-define=TTS_KEY=$TTS_KEY
    artifacts:
      - build/**/outputs/**/*.apk
  ios:
    name: Learn Punjabi iOS IPA (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create platform folders and check app code
        script: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done || true
          if [ -f punjabi_learn/lib/main.dart ]; then cp -R punjabi_learn/. .; fi
          mkdir -p assets/audio
          for f in *.m4a *.mp3 *.wav *.aac; do [ -f "$f" ] && mv "$f" assets/audio/; done || true
          for d in recordings Recordings; do [ -d "$d" ] && find "$d" -type f \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.aac' \) -exec cp {} assets/audio/ \; ; done || true
          if [ -f main.dart ] && [ ! -f lib/main.dart ]; then mkdir -p lib && cp main.dart lib/main.dart; fi
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/main.dart.bak; fi
          flutter create --platforms=android,ios --project-name punjabi_learn .
          if [ -f /tmp/main.dart.bak ]; then cp /tmp/main.dart.bak lib/main.dart; fi
          rm -rf test
          if ! grep -q "Learn Punjabi" lib/main.dart; then echo "ERROR: lib/main.dart is missing or is the default counter app. Add the Punjabi app code at lib/main.dart in the repo."; exit 1; fi
      - name: Get packages
        script: |
          flutter pub add flutter_tts shared_preferences audioplayers http
          flutter pub get
      - name: Set app name and icon
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Learn Punjabi" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Learn Punjabi" ios/Runner/Info.plist
          if [ -f assets/icon.png ] && [ -f assets/icon_fg.png ]; then
            flutter pub add --dev flutter_launcher_icons
            printf '%s\n' 'flutter_launcher_icons:' '  android: true' '  ios: true' '  image_path: "assets/icon.png"' '  remove_alpha_ios: true' '  adaptive_icon_background: "#C5426C"' '  adaptive_icon_foreground: "assets/icon_fg.png"' > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons
          else
            echo "WARNING: assets/icon.png or assets/icon_fg.png not found, using the default icon."
          fi
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign --dart-define=TTS_KEY=$TTS_KEY
      - name: Package IPA
        script: |
          rm -rf Payload punjabi_learn.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          plutil -lint Payload/Runner.app/Info.plist
          ls Payload/Runner.app | head -20
          ditto -c -k --keepParent Payload punjabi_learn.ipa
          unzip -l punjabi_learn.ipa | head -12
          ls -la punjabi_learn.ipa
    artifacts:
      - punjabi_learn.ipa
